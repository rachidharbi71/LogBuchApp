<style>
/* ============ Grundgestaltung ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Yu Gothic', 'YuGothic', 'Segoe UI', sans-serif;
  background: #f4f7fb;
  color: #222;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
h1 { font-size: 28px; }
h2 { font-size: 18px; }

/* Fixiertes Logo rechts oben (ca. 28 mm x 28 mm) */
#logoFixed {
  position: fixed; top: 10px; right: 12px; z-index: 100;
  width: 28mm; height: 28mm; pointer-events: none;
}
#logoFixed svg { width: 100%; height: 100%; }

/* ============ Bereichsaufteilung 45 % / 55 % ============ */
#topArea {
  position: relative;
  height: 45vh; min-height: 340px;
  overflow-y: auto;
  padding: 12px 16px 16px 16px;
  border-bottom: 2px solid #c8d4e0;
  background: #f4f7fb;
}
#bottomArea {
  height: 55vh; min-height: 260px;
  overflow-y: auto;
  padding: 12px 16px;
  background: #eef3f8;
}
#watermark {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(46vh, 420px); height: min(46vh, 420px);
  opacity: 0.12; filter: blur(1.5px);
  pointer-events: none; z-index: 0;
}
#topContent { position: relative; z-index: 1; }

/* ============ Schriftgroessen (Abschnitt 1.1, Stand 17.10.2026) ============ */
input, select, textarea, button, .dd-btn { font-size: 16px; font-family: inherit; }
label, .feldlabel { font-size: 14px; font-family: inherit; }
.hinweis, #ergebnisListe, .dd-auswahl-anzeige { font-size: 15px; }

/* ============ Zeilen / Kaskade ============ */
.zeile { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 18px; margin: 8px 0; }
.feld { display: inline-flex; flex-direction: column; gap: 3px; }
.feldgruppe { display: inline-flex; align-items: flex-end; gap: 6px; }

/* ============ Eingabefelder ============ */
input[type="text"], input[type="password"], input[type="date"], textarea {
  padding: 5px 8px; border: 1.5px solid #7a8aa0; border-radius: 5px;
  background: #fff; color: #222;
  field-sizing: content; min-width: 5ch;
  line-height: 1.4; min-height: 2.2em; /* Text immer vollständig sichtbar */
}
select { line-height: 1.4; min-height: 2.2em; }
input#kuerzelInp { min-width: 4ch; letter-spacing: 0.15em; }
textarea {
  min-width: min(60ch, 90vw); max-width: min(70ch, 95vw);
  min-height: 5em; field-sizing: content; resize: none; display: block;
}
input:disabled, input.ausgegraut { background: #e4e8ee; color: #333a45; }
input[type="date"] { min-width: 11ch; }

button {
  padding: 6px 22px; border: none; border-radius: 6px;
  cursor: pointer; color: #fff;
}
button.gruen { background: #1e9e4b; }
button.rot { background: #d32f2f; }
button.hellgrau { background: #b9c2cd; color: #222; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============ Blinken ============ */
@keyframes blinkFeld {
  0%, 100% { border-color: #7a8aa0; box-shadow: none; }
  50% { border-color: #e0332e; box-shadow: 0 0 6px rgba(224,51,46,0.6); }
}
.blinkt { animation: blinkFeld 1s ease-in-out infinite; }

/* ============ Hinweis- und Statusmeldungen (Anhang Nr. 15) ============ */
#meldung {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 200; padding: 8px 18px; border-radius: 6px;
  background: #fff; display: none; max-width: 90vw; text-align: center;
}
#meldung.aktiv { display: block; color: #d32f2f; border: 1.5px solid #d32f2f; font-size: 15px; }
#meldung.blinkend { animation: blinkFeld 1s ease-in-out infinite; }
#meldung.fehler { color: #d32f2f; border-color: #d32f2f; }

/* ============ Eigene Dropdown-Komponente ============ */
.dd { position: relative; display: inline-block; }
.dd-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 10px; border: 1.5px solid #7a8aa0; border-radius: 5px;
  background: #fff; color: #222; cursor: pointer; min-width: 9ch; text-align: left;
  max-width: 60vw; overflow-wrap: anywhere;
  line-height: 1.4; min-height: 2.2em;
}
.dd-btn::after { content: "▼"; font-size: 12px; margin-left: auto; color: #55606e; }
.dd.auf .dd-btn { border-radius: 5px 5px 0 0; }
.dd-liste {
  display: none; position: absolute; top: 100%; left: 0; z-index: 150;
  min-width: 100%; max-width: min(92vw, 60ch);
  background: #fff; border: 1.5px solid #7a8aa0; border-top: none;
  border-radius: 0 0 5px 5px;
  max-height: 45vh; overflow-y: auto; box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}
.dd.auf .dd-liste { display: block; }
.dd-opt {
  padding: 6px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  font-size: 16px; border-left: 3px solid transparent;
}
.dd-opt:hover { background: #eef3f8; }
.dd-opt.ausgewaehlt::before { content: "✓"; font-weight: bold; }
.dd-opt.ausgewaehlt { padding-left: 2px; }
.dd-opt[data-farbe="gruen"] { border-left-color: #16a34a; background-color: #f0fdf4; }
.dd-opt[data-farbe="rot"] { border-left-color: #dc2626; background-color: #fef2f2; }
.dd-opt[data-farbe="gelb"] { border-left-color: #eab308; background-color: #fefce8; }
.dd-opt[data-farbe="blau"] { border-left-color: #2563eb; background-color: #eff6ff; }
.dd-opt[data-farbe="orange"] { border-left-color: #ea8a1c; background-color: #fff7ed; }
.dd-opt[data-farbe="violett"] { border-left-color: #7c3aed; background-color: #f5f3ff; }
.dd-opt[data-farbe="petrol"] { border-left-color: #0f766e; background-color: #f0fdfa; }
.dd-opt.gesperrt { color: #9aa4b0; background: #f2f4f7; font-style: italic; }
.dd-opt.freigeschaltet { color: #dc2626; font-weight: bold; }
.dd-ck { width: 17px; height: 17px; flex: none; }

/* Umrandung des geschlossenen Dropdown-Felds (per JS gesetzt) */
.dd-btn.rand-gruen { border: 3px solid #16a34a; }
.dd-btn.rand-rot { border: 3px solid #dc2626; }
.dd-btn.rand-gelb { border: 3px solid #eab308; }
.dd-btn.rand-blau { border: 3px solid #2563eb; }
.dd-btn.rand-orange { border: 3px solid #ea8a1c; }
.dd-btn.rand-violett { border: 3px solid #7c3aed; }
.dd-btn.rand-petrol { border: 3px solid #0f766e; }
.dd-btn.rot-text { color: #dc2626; font-weight: bold; }

/* ============ Infofeld / Anhang ============ */
#infoBlock { display: none; margin-top: 16px; justify-content: center; gap: 24px; flex-wrap: wrap; }
#infoBlock.sichtbar { display: flex; }
#anhangBox { display: flex; flex-direction: column; gap: 6px; max-width: 340px; }
#anhangBox input[type="file"] { color: transparent; } /* native Beschriftung verbergen */
#anhangBox input[type="file"]::file-selector-button { color: #222; }
#anhangStatus { font-size: 15px; }
#anhangStatus.grau { color: #8a94a0; }
#anhangStatus.gruen { color: #1e9e4b; font-weight: bold; }
#anhangStatus.rot { color: #d32f2f; font-weight: bold; }
#infofeldHinweis { color: #55606e; font-size: 14px; margin-left: 6px; }
#anhangListe { list-style: none; font-size: 15px; }
#anhangListe li { display: flex; gap: 8px; align-items: center; background: #fff; border: 1px solid #c8d4e0; border-radius: 4px; padding: 3px 8px; margin-top: 4px; }
#anhangListe button { padding: 1px 8px; font-size: 14px; background: #b9c2cd; color: #222; }
#btnZeile { display: none; justify-content: center; gap: 20px; margin-top: 16px; }
#btnZeile.sichtbar { display: flex; }

/* ============ Suchbereich ============ */
#suchKriteriumZeile { display: none; }
#suchKriteriumZeile.sichtbar { display: flex; }
#suchBtnZeile { display: none; justify-content: center; gap: 20px; margin-top: 12px; }
#suchBtnZeile.sichtbar { display: flex; }

/* ============ Ergebnisbereich ============ */
#ergebnisWrap { display: flex; gap: 16px; align-items: flex-start; }
#ergebnisListe { flex: 1; }
.eintrag {
  background: #fff; border: 3px solid #999; border-radius: 8px;
  padding: 10px 14px; margin-bottom: 12px; line-height: 1.5;
}
.eintrag.k-gruen { border-color: #16a34a; }
.eintrag.k-rot { border-color: #dc2626; }
.eintrag.k-gelb { border-color: #eab308; }
.eintrag.k-blau { border-color: #2563eb; }
.eintrag .zeile-art { font-weight: bold; }
.eintrag.k-gruen .zeile-art { color: #15803d; }
.eintrag.k-rot .zeile-art { color: #dc2626; }
.eintrag.k-gelb .zeile-art { color: #a16207; }
.eintrag.k-blau .zeile-art { color: #2563eb; }
.eintrag a { color: #1a5fb4; }

/* Feld Schueler-ID */
#schuelerIdFeld {
  display: none; flex: none;
  width: min(25vw, 570px); min-width: 420px;
  background: #fff; border: 1px solid #e0e0e0; border-left: 6px solid #ea8a1c;
  border-radius: 6px; padding: 12px 14px; font-size: 15px; line-height: 1.6;
}
#schuelerIdFeld.sichtbar { display: block; }
#schuelerIdFeld h3 { font-size: 18px; margin-bottom: 8px; }
#schuelerIdFeld .idLabel { font-weight: bold; color: #111; }
#schuelerIdFeld .idInfo { color: #444; }
@media (max-width: 900px) {
  #ergebnisWrap { flex-direction: column; }
  #schuelerIdFeld { width: 100%; min-width: 0; }
}

.kat-kopf { font-size: 15px; font-weight: bold; margin: 12px 0 8px 0; padding-bottom: 3px; border-bottom: 1.5px solid #c8d4e0; }
.kat-kopf.k-gruen { color: #15803d; }
.kat-kopf.k-rot { color: #dc2626; }
.kat-kopf.k-gelb { color: #a16207; }
.kat-kopf.k-blau { color: #2563eb; }

#letzteEintraege { margin-top: 8px; }
#letzteEintraege .eintrag { border-width: 1.5px; }

/* ============ Bericht drucken (PDF) ============ */
#druckBereich { display: none; }
#berichtBtnZeile { margin-bottom: 10px; }
@keyframes glasBlink {
  0%, 100% { background: rgba(147, 197, 253, 0.38); box-shadow: 0 2px 10px rgba(59, 130, 246, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.55); }
  50% { background: rgba(147, 197, 253, 0.68); box-shadow: 0 2px 14px rgba(59, 130, 246, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.85); }
}
#berichtBtnZeile button {
  font-size: 15px; color: #1e3a5f; cursor: pointer;
  background: rgba(147, 197, 253, 0.42);              /* hellblau, halbtransparent */
  border: 1px solid rgba(147, 197, 253, 0.65);
  border-radius: 10px;
  backdrop-filter: blur(8px);                          /* Glaseffekt */
  -webkit-backdrop-filter: blur(8px);
  animation: glasBlink 4s ease-in-out infinite;        /* dezentes langsames Blinken */
}
@media print {
  html, body { height: auto; overflow: visible; background: #fff; }
  #topArea, #bottomArea, #logoFixed, #meldung, #berichtBtnZeile { display: none !important; }
  #druckBereich { display: block; position: relative; font-size: 10.5pt; color: #111; }
  #druckKopfZeile { display: flex; justify-content: space-between; align-items: flex-start; }
  #druckLinks { flex: 1; padding-right: 6mm; }
  #druckLogo { width: 50mm; height: 50mm; flex: none; }
  #druckLogo svg { width: 100%; height: 100%; }
  #druckCopyright { font-size: 8pt; color: #9aa4b0; }
  #druckKopf { margin-top: 2mm; }
  #druckKopf { margin-bottom: 7mm; }
  #druckKopf h1 { font-size: 20pt; margin-bottom: 2mm; color: #2f4a68; }
  #druckMeta { font-size: 10pt; color: #444; line-height: 1.55; }
  #druckSchueler { margin: 5mm 0 6mm 0; }
  #druckSchueler h2 { font-size: 13pt; margin-bottom: 2mm; }
  .druck-kat { font-size: 13pt; font-weight: bold; margin: 5mm 0 3mm 0; padding-bottom: 1mm; border-bottom: 0.5mm solid #c8d4e0; page-break-after: avoid; }
  .druck-kat.k-gruen { color: #15803d; }
  .druck-kat.k-rot { color: #dc2626; }
  .druck-kat.k-gelb { color: #a16207; }
  .druck-kat.k-blau { color: #2563eb; }
  .druck-eintrag { border: 1px solid #c0c8d2; border-left: 1.5mm solid #999; border-radius: 2mm; padding: 3mm 4mm; margin-bottom: 4mm; page-break-inside: avoid; line-height: 1.45; }
  .druck-eintrag .d-art { font-weight: bold; }
  .druck-eintrag.k-gruen { border-left-color: #16a34a; } .druck-eintrag.k-gruen .d-art { color: #15803d; }
  .druck-eintrag.k-rot { border-left-color: #dc2626; } .druck-eintrag.k-rot .d-art { color: #dc2626; }
  .druck-eintrag.k-gelb { border-left-color: #eab308; } .druck-eintrag.k-gelb .d-art { color: #a16207; }
  .druck-eintrag.k-blau { border-left-color: #2563eb; } .druck-eintrag.k-blau .d-art { color: #2563eb; }
  @page { size: A4; margin: 15mm; }
}
.versteckt { display: none !important; }
#passwortFeld input { min-width: 8ch; }
</style>

<script>
"use strict";
/* ================= Konfiguration ================= */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_3v6wOL3Fk1ZvXSOFwGKqGAw3TAm_dsd1RIwQ7HXNrESILALbLA5OBjYOuRy4ieGGFw/exec';
const PASSWORT_SB = "1971";

const SCHUELERLISTE = [
  "Amuzu, Prince","Arfe, Selya","Bernsdorf, Emily","Beskardes (Beşkardeş), Efe",
  "Dagtekin (Dağtekin), Ahmet","El Arrag, Hidaya","El Yachaoui, Moussa","Faizi, Fereshte",
  "Galali, Bahoz","Große, Jayden","Hafiane, Yassmine","Kremsier, Philipp",
  "Kusi Oppong, Jayden","Labahn, Fabienne","Mehmed, Neriman","Mpanzu, Ambrósio",
  "Othman, Helin","Pawlak, Alisha","Raulf, Celina","Saighani, Sorosch",
  "Sarpong, Susana","Schwarzbrunn, Cheyenne","Shaker, Shaker","Shutcha, Amour",
  "Strek, Emilia Sophie","Tserkovna, Alisa","Ural, Umut"
];
const ARTE = [
  { wert:"Inklusion", farbe:"gruen" },
  { wert:"Vorfallmelder", farbe:"rot" },
  { wert:"Elterngespräch", farbe:"gelb" },
  { wert:"Schülerbesonderheit", farbe:"blau" }
];
const ARTE_SUCHE = ARTE.slice(0,3);
const SONDER = [
  { wert:"BUT", farbe:"gruen" }, { wert:"Förderbedarf", farbe:"orange" },
  { wert:"LRS", farbe:"violett" }, { wert:"Nachteilsausgleich", farbe:"petrol" },
  { wert:"Merkmal", farbe:"blau" }
];
const FOERDER = ["LE","GE","ESE","SQ","KME","ASS"];
const FARBE_KLASSE = { gruen:"k-gruen", rot:"k-rot", gelb:"k-gelb", blau:"k-blau" };

/* ================= Zustand ================= */
let zustand = {
  modus:null, kuerzel:"", schulfach:"", art:"", artFarbe:"",
  sbFreigeschaltet:false, sonderTyp:"", sonderWert:"",
  schuelerAuswahl:[], datum:"", klasse:"",
  anhaenge:[], anhangFehler:false, schuelerBlinkAus:false
};
let letzteEintraege = [];
let letzteTreffer = [];

/* ================= Hilfsfunktionen ================= */
function el(tag, attrs, parent){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function zeigeMeldung(text, opt){
  opt = opt || {};
  const m = document.getElementById('meldung');
  m.textContent = text;
  m.className = 'aktiv' + (opt.blinkend !== false ? ' blinkend' : '') + (opt.fehler ? ' fehler' : '');
  clearTimeout(m._t);
  if (!opt.dauerhaft) m._t = setTimeout(()=>{ m.className=''; m.textContent=''; }, opt.ms || 4000);
}
function berechneKlasse(isoDatum){
  const d = new Date(isoDatum + "T00:00:00");
  const jahr = d.getFullYear(), monat = d.getMonth(), tag = d.getDate(); // Monat 0-basiert
  // Klassenwechsel jeweils am 30.07.; Buchstabe C bleibt bestehen (exakt nach Anweisung Abschnitt 6)
  let stufe = 6 + (jahr - 2027) + ((monat > 6 || (monat === 6 && tag >= 30)) ? 1 : 0);
  if (stufe < 1) stufe = 1;
  return stufe + "C";
}
function isoZuDeutsch(d){
  if(!d) return "";
  d = String(d).trim();
  let m = d.match(/(\d{4})-(\d{2})-(\d{2})/);            // ISO, auch mit Zeitanteil
  if (m) return m[3]+"."+m[2]+"."+m[1];
  if (/^\d{2}\.\d{2}\.\d{4}/.test(d)) return d;         // bereits TT.MM.JJJJ
  const dt = new Date(d);                                    // z. B. "Tue Nov 25 2025 09:00:00 GMT+0100 ..."
  if (!isNaN(dt)) return String(dt.getDate()).padStart(2,'0') + "." + String(dt.getMonth()+1).padStart(2,'0') + "." + dt.getFullYear();
  return d;
}
function alsIsoDatum(d){
  d = String(d || '').trim();
  var m = d.match(/^(\d{4})-(\d{2})-(\d{2})/);   // ISO JJJJ-MM-TT
  if (m) return m[1]+'-'+m[2]+'-'+m[3];
  m = d.match(/^(\d{2})\.(\d{2})\.(\d{4})/);   // TT.MM.JJJJ
  if (m) return m[3]+'-'+m[2]+'-'+m[1];
  var dt = new Date(d);                            // Sheet-Datumsobjekte, z. B. "Tue Nov 25 2025 ..."
  if (!isNaN(dt)) return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  return d;
}
function farbeZuRand(farbe){ return farbe ? "rand-"+farbe : ""; }

/* ============ Eigene Dropdown-Komponente ============ */
/* opts: { label, placeholder, optionen:[{wert, farbe, gesperrt, freigeschaltet}],
   multi, onChange(ausgewaehltArray) } */
function erstelleDropdown(parent, opts){
  const feld = el('div', {class:'feld'}, parent);
  if (opts.label) el('label', {class:'feldlabel'}, feld).textContent = opts.label;
  const dd = el('div', {class:'dd'}, feld);
  const btn = el('button', {type:'button', class:'dd-btn'}, dd);
  btn.textContent = opts.placeholder || "--- bitte wählen ---";
  const liste = el('div', {class:'dd-liste', role:'listbox'}, dd);
  const auswahl = [];

  opts.optionen.forEach(opt=>{
    const o = el('div', {class:'dd-opt', role:'option'}, liste);
    o.dataset.wert = opt.wert;
    if (opt.farbe) o.dataset.farbe = opt.farbe;
    if (opt.gesperrt) o.classList.add('gesperrt');
    if (opt.freigeschaltet) o.classList.add('freigeschaltet');
    if (opts.multi) {
      const ck = el('input', {type:'checkbox', class:'dd-ck'}, o);
      ck.addEventListener('click', e=>e.stopPropagation());
      ck.addEventListener('change', ()=>{
        if (ck.checked) { if(!auswahl.includes(opt.wert)) auswahl.push(opt.wert); }
        else { const i = auswahl.indexOf(opt.wert); if(i>-1) auswahl.splice(i,1); }
        o.classList.toggle('ausgewaehlt', ck.checked);
        btn.textContent = auswahl.length ? auswahl.join("; ") : (opts.placeholder || "--- bitte wählen ---");
        opts.onChange(auswahl.slice());
      });
      o.appendChild(document.createTextNode(opt.wert));
    } else {
      o.textContent = opt.wert;
      o.addEventListener('click', ()=>{
        auswahl.length = 0; auswahl.push(opt.wert);
        liste.querySelectorAll('.dd-opt').forEach(x=>x.classList.remove('ausgewaehlt'));
        o.classList.add('ausgewaehlt');
        btn.textContent = opt.wert;
        dd.classList.remove('auf');
        opts.onChange(auswahl.slice());
      });
    }
  });

  btn.addEventListener('click', e=>{
    e.stopPropagation();
    if (!opts.multi && opts.optionen.some(o=>o.gesperrt && !opts.onGesperrtKlick)) {}
    document.querySelectorAll('.dd.auf').forEach(x=>{ if(x!==dd) x.classList.remove('auf'); });
    dd.classList.toggle('auf');
  });
  dd.addEventListener('keydown', e=>{
    if (e.key === 'Escape') dd.classList.remove('auf');
  });
  return {
    element: dd, btn, auswahl,
    setzeBtnText(t){ btn.textContent = t; },
    setzeRand(farbe){ btn.className = 'dd-btn' + (farbe ? ' rand-'+farbe : ''); },
    markiereFreigeschaltet(wert){
      const o = liste.querySelector('[data-wert="'+wert+'"]');
      if (o){ o.classList.remove('gesperrt'); o.classList.add('freigeschaltet'); }
      btn.classList.add('rot-text');
    },
    reset(){
      auswahl.length = 0;
      btn.textContent = opts.placeholder || "--- bitte wählen ---";
      btn.className = 'dd-btn';
      liste.querySelectorAll('.dd-opt').forEach(x=>x.classList.remove('ausgewaehlt'));
      liste.querySelectorAll('.dd-ck').forEach(c=>c.checked=false);
    },
    wert(){ return auswahl.slice(); }
  };
}
document.addEventListener('click', e=>{
  if (!e.target.closest('.dd')) document.querySelectorAll('.dd.auf').forEach(x=>x.classList.remove('auf'));
});

/* ================= Anliegen ================= */
const anliegenSel = document.getElementById('anliegenSel');
anliegenSel.addEventListener('change', ()=>{
  const wert = anliegenSel.value;
  if (!wert) return;
  anliegenSel.classList.remove('blinkt');
  document.getElementById('ergebnisListe').innerHTML = '';
  document.getElementById('schuelerIdFeld').classList.remove('sichtbar');
  document.getElementById('berichtBtnZeile').classList.add('versteckt');
  document.getElementById('letzteEintraege').classList.add('versteckt');
  if (wert === 'eingeben') startEingabeModus();
  else startSucheModus();
});

/* ================= EINGABEMODUS ================= */
let ddArt, ddSonder, ddUnter, ddSchueler;

function startEingabeModus(){
  zustand.modus = 'eingeben';
  document.getElementById('sucheModus').classList.add('versteckt');
  document.getElementById('eingabeModus').classList.remove('versteckt');
  baueLehrerZeile();
}
function baueLehrerZeile(){
  const zeile = document.getElementById('zeileLehrer');
  zeile.innerHTML = '';
  const gruppe = el('div', {class:'feldgruppe'}, zeile);

  // Lehrerkuerzel
  const f1 = el('div', {class:'feld'}, gruppe);
  el('label', {class:'feldlabel', for:'kuerzelInp'}, f1).textContent = 'Lehrerkürzel';
  const inp = el('input', {type:'text', id:'kuerzelInp', class:'blinkt', maxlength:'4', autocomplete:'off'}, f1);
  inp.addEventListener('input', ()=>{ inp.value = inp.value.toUpperCase().replace(/[^A-Z]/g,''); });
  inp.addEventListener('keydown', e=>{
    if (e.key === 'Enter'){
      const v = inp.value.trim();
      if (v.length < 2 || v.length > 4){ zeigeMeldung('Bitte 2 bis 4 Buchstaben eingeben.', {fehler:true}); return; }
      e.preventDefault();
      zustand.kuerzel = v;
      inp.classList.remove('blinkt');
      baueSchulfach(gruppe);
    }
  });
  inp.focus();
}
function baueSchulfach(gruppe){
  if (document.getElementById('fachInp')) return;
  const f2 = el('div', {class:'feld'}, gruppe);
  el('label', {class:'feldlabel', for:'fachInp'}, f2).textContent = 'Schulfach/Funktion';
  const inp = el('input', {type:'text', id:'fachInp', class:'blinkt', autocomplete:'off'}, f2);
  inp.addEventListener('keydown', e=>{
    if (e.key === 'Enter'){
      const v = inp.value.trim();
      if (!v){ zeigeMeldung('Bitte Schulfach/Funktion eingeben.', {fehler:true}); return; }
      e.preventDefault();
      zustand.schulfach = v; // keine Grossschreibungspflicht
      inp.classList.remove('blinkt');
      baueArtDropdown();
    }
  });
  inp.focus();
}

/* --- Art des Eintrags (eigene Dropdown-Komponente) --- */
function baueArtDropdown(){
  if (ddArt) return;
  const zeile = document.getElementById('zeileArt');
  ddArt = erstelleDropdown(zeile, {
    label: 'Art des Eintrags',
    placeholder: '--- bitte wählen ---',
    optionen: ARTE.map(a=>({ wert:a.wert, farbe:a.farbe,
      gesperrt: a.wert==='Schülerbesonderheit' && !zustand.sbFreigeschaltet,
      freigeschaltet: a.wert==='Schülerbesonderheit' && zustand.sbFreigeschaltet })),
    onChange(arr){
      const wert = arr[0];
      if (wert === 'Schülerbesonderheit' && !zustand.sbFreigeschaltet){
        zeigeMeldung("'Schülerbesonderheit' erfordert ein Passwort");
        bauePasswortfeld();
        ddArt.setzeBtnText('--- bitte wählen ---');
        return;
      }
      zustand.art = wert;
      zustand.artFarbe = (ARTE.find(a=>a.wert===wert)||{}).farbe || '';
      ddArt.setzeRand(zustand.artFarbe);
      if (zustand.artFarbe === 'blau') ddArt.btn.classList.add('rot-text');
      entfernePasswortfeld();
      if (wert === 'Schülerbesonderheit') baueSonderauswahl();
      else { entferneSonderauswahl(); }
      baueDatumZeile();
      pruefeVollstaendig();
    }
  });
}

/* --- Passwortabfrage --- */
function bauePasswortfeld(){
  if (document.getElementById('passwortFeld')) return;
  const zeile = document.getElementById('zeileArt');
  const f = el('div', {class:'feld', id:'passwortFeld'}, zeile);
  el('label', {class:'feldlabel', for:'pwInp'}, f).textContent = 'Passwort';
  const pw = el('input', {type:'password', id:'pwInp', class:'blinkt', placeholder:'****', maxlength:'10', autocomplete:'off'}, f);
  pw.addEventListener('keydown', e=>{
    if (e.key === 'Enter'){
      e.preventDefault();
      if (pw.value === PASSWORT_SB){
        zustand.sbFreigeschaltet = true;
        entfernePasswortfeld();
        ddArt.markiereFreigeschaltet('Schülerbesonderheit');
        ddArt.setzeRand('blau');
        ddArt.btn.textContent = 'Schülerbesonderheit';
        ddArt.auswahl.length = 0; ddArt.auswahl.push('Schülerbesonderheit');
        zustand.art = 'Schülerbesonderheit'; zustand.artFarbe = 'blau';
        zeigeMeldung("Berechtigung für 'Schülerbesonderheit' freigeschaltet");
        baueSonderauswahl();
        baueDatumZeile();
      } else {
        zeigeMeldung('Falsches Passwort.', {fehler:true, dauerhaft:true});
      }
    }
  });
  pw.focus();
}
function entfernePasswortfeld(){
  const f = document.getElementById('passwortFeld');
  if (f) f.remove();
}

/* --- Datum / Klasse / Schueler --- */
function baueDatumZeile(){
  const zeile = document.getElementById('zeileDatum');
  if (!zustand.art) return;
  if (document.getElementById('datumInp')) return; // vorhandene Eingaben nicht verwerfen
  zeile.innerHTML = '';

  const f1 = el('div', {class:'feld'}, zeile);
  el('label', {class:'feldlabel', for:'datumInp'}, f1).textContent = 'Datum des Eintrags';
  const datum = el('input', {type:'date', id:'datumInp', class:'blinkt'}, f1);
  datum.addEventListener('change', ()=>{
    if (!datum.value) return;
    datum.classList.remove('blinkt');
    zustand.datum = datum.value;
    zustand.klasse = berechneKlasse(datum.value);
    const kInp = document.getElementById('klasseInp');
    if (kInp) kInp.value = zustand.klasse;
    baueSchuelerDropdown();
    pruefeVollstaendig();
  });

  const f2 = el('div', {class:'feld'}, zeile);
  el('label', {class:'feldlabel', for:'klasseInp'}, f2).textContent = 'Klasse';
  el('input', {type:'text', id:'klasseInp', class:'ausgegraut', disabled:'disabled'}, f2);
}
function baueSchuelerDropdown(){
  if (ddSchueler) ddSchueler.element.closest('.feld').remove();
  const zeile = document.getElementById('zeileDatum');
  ddSchueler = erstelleDropdown(zeile, {
    label: 'Schüler (Mehrfachauswahl möglich)',
    placeholder: '--- bitte wählen ---',
    multi: true,
    optionen: SCHUELERLISTE.map(s=>({wert:s})),
    onChange(arr){
      zustand.schuelerAuswahl = arr;
      if (arr.length && !zustand.schuelerBlinkAus){
        zustand.schuelerBlinkAus = true; // Blinken endet dauerhaft bis Reset
        ddSchueler.btn.classList.remove('blinkt');
      }
      if (arr.length && ddSchueler.btn.classList.contains('blinkt')) ddSchueler.btn.classList.remove('blinkt');
      pruefeVollstaendig();
    }
  });
  if (!zustand.schuelerBlinkAus) ddSchueler.btn.classList.add('blinkt');
}

/* --- Sonderauswahl --- */
function baueSonderauswahl(){
  entferneSonderauswahl(true);
  const zeile = document.getElementById('zeileSonder');
  ddSonder = erstelleDropdown(zeile, {

}

function istVollstaendig(){
  if (!zustand.art || !zustand.datum) return false;
  if (zustand.schuelerAuswahl.length === 0) return false;
  if (zustand.art === 'Schülerbesonderheit'){

    if (zustand.sonderTyp !== 'Merkmal' && !zustand.sonderWert) return false;

  }
  return true;
}

    block.classList.add('sichtbar');

/* --- Dateianhang --- */
const anhangInput = document.getElementById('anhangInput');
const MAX_DATEIGROESSE = 5 * 1024 * 1024; // 5 MB
let anhangStatusTimer = null;
function setzeAnhangStatus(){
  const st = document.getElementById('anhangStatus');
  if (zustand.anhangFehler){
    st.className = 'rot'; st.textContent = 'Datei zu groß!';
    clearTimeout(anhangStatusTimer);
    anhangStatusTimer = setTimeout(()=>{ // 3 Sekunden anzeigen, dann verschwinden
      zustand.anhangFehler = false;
      setzeAnhangStatus();
    }, 3000);
  } else if (zustand.anhaenge.length){
    st.className = 'gruen';
    st.textContent = zustand.anhaenge.length + (zustand.anhaenge.length === 1 ? ' Datei ausgewählt' : ' Dateien ausgewählt');
  } else {
    st.className = 'grau'; st.textContent = 'Keine Datei ausgewählt';
  }
}
anhangInput.addEventListener('change', ()=>{
  const erlaubt = ['pdf','doc','docx','jpg','jpeg','png'];
  for (const datei of anhangInput.files){
    const ext = datei.name.split('.').pop().toLowerCase();
    if (!erlaubt.includes(ext)){
      zeigeMeldung('Dateiformat nicht zulässig: ' + datei.name + ' (nur PDF, Word, JPEG, PNG)', {fehler:true, dauerhaft:true});
      continue;
    }
    if (datei.size >= MAX_DATEIGROESSE){
      zustand.anhangFehler = true; // roter Hinweis "Datei zu groß!" – Datei wird nicht übernommen
      setzeAnhangStatus();
      zeigeMeldung('Datei zu groß (max. 5 MB): ' + datei.name, {fehler:true});
      continue;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      zustand.anhaenge.push({ name: datei.name, typ: datei.type, inhalt: reader.result.split(',')[1] });
      zustand.anhangFehler = false;
      zeigeAnhangListe();
    };
    reader.readAsDataURL(datei);
  }
  anhangInput.value = '';
});
function zeigeAnhangListe(){
  const ul = document.getElementById('anhangListe');
  ul.innerHTML = '';
  zustand.anhaenge.forEach((a,i)=>{
    const li = el('li', {}, ul);
    const kb = Math.round((a.inhalt.length * 3/4) / 1024);
    el('span', {}, li).textContent = a.name + ' (' + kb + ' KB)';
    const b = el('button', {type:'button'}, li); b.textContent = '✕';
    b.addEventListener('click', ()=>{ zustand.anhaenge.splice(i,1); zeigeAnhangListe(); });
  });
  setzeAnhangStatus();
}

  if (!hw) return;
  hw.textContent = infofeldOptional() ? ' * optional' : ' * mindestens 5 Zeichen';

/* --- Speichern --- */
let speichereLaeuft = false;
document.getElementById('btnSpeichern').addEventListener('click', async ()=>{
  if (speichereLaeuft) return; // Doppelklick waehrend des Speicherns wird ignoriert
  const btnSpeichern = document.getElementById('btnSpeichern');
  if (!istVollstaendig()){ zeigeMeldung('Bitte alle Pflichtangaben vervollständigen.', {fehler:true, dauerhaft:true}); return; }
  if (!infofeldOptional() && infofeld.value.trim().length < 5){ zeigeMeldung('Infofeld muss mindestens 5 Zeichen enthalten.', {fehler:true, dauerhaft:true}); return; }
  const istMerkmal = zustand.sonderTyp === 'Merkmal';
  const daten = {
    lehrerkuerzel: zustand.kuerzel,
    schulfach: zustand.schulfach,
    art: zustand.art,
    datum: zustand.datum,
    klasse: zustand.klasse,
    schueler: zustand.art === 'Schülerbesonderheit' && istMerkmal ? [] : zustand.schuelerAuswahl,
    sonderTyp: zustand.art === 'Schülerbesonderheit' ? zustand.sonderTyp : '',
    sonderWert: zustand.art === 'Schülerbesonderheit' ? (istMerkmal ? '' : zustand.sonderWert) : '',
    merkmalSchueler: istMerkmal ? zustand.schuelerAuswahl : [],
    nachricht: infofeld.value,
    anhaenge: zustand.anhaenge,
    eintragId: Date.now().toString(36) + Math.random().toString(36).slice(2, 8) // gegen Doppeleintraege
  };
  speichereLaeuft = true;
  btnSpeichern.disabled = true;
  btnSpeichern.textContent = 'Speichere …';
  zeigeMeldung('Bitte warten! … Speichervorgang kann bis zu 30 s dauern', {blinkend:false, dauerhaft:true});
  // Verifizierung: Ist der Eintrag wirklich im Sheet angekommen?
  // (Die POST-Antwort kann durch Googles Redirect unlesbar sein – der Eintrag ist dann trotzdem schon gespeichert.)
  async function eintragVerifizieren(){
    try {
      const vres = await fetch(SCRIPT_URL + '?aktion=letzter&kuerzel=' + encodeURIComponent(daten.lehrerkuerzel));
      const v = JSON.parse(await vres.text());
      if (!v.gefunden) return false;
      if (v.art !== daten.art) return false;
      if (alsIsoDatum(v.datum) !== daten.datum) return false;
      const schuelerPassend = (daten.schueler || []).length === 0 ||
        (daten.schueler || []).some(s => (v.schueler || '').indexOf(s) !== -1);
      if (!schuelerPassend) return false;
      // Zeitstempel muss frisch sein (TT.MM.JJJJ HH:MM:SS)
      const m = String(v.zeitstempel || '').match(/(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2}):(\d{2})/);
      if (m){
        const t = new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5], +m[6]);
        if (Date.now() - t.getTime() > 3 * 60 * 1000) return false; // älter als 3 Minuten
      }
      return true;
    } catch (e) { return false; }
  }
  async function warteVerifizieren(versuche){
    for (let i = 0; i < versuche; i++){
      if (await eintragVerifizieren()) return true;
      await new Promise(r => setTimeout(r, 1500));
    }
    return false;
  }
  try {
    // 1) POST senden – Antwort ggf. unlesbar, deshalb danach verifizieren
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 60000);
    try {
      await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(daten), signal: ctrl.signal });
    } catch (e1) { /* Antwort unlesbar – Verifizierung entscheidet */ }
    finally { clearTimeout(timer); }
    if (await warteVerifizieren(3)) {
      zeigeMeldung('Eintrag wurde gespeichert');
    } else {
      // 2) GET-Fallback (nur ohne große Anhänge möglich) und erneut verifizieren
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(daten))))
        .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      const url = SCRIPT_URL + '?aktion=speichern&daten=' + encodeURIComponent(b64);
      if (url.length <= 7500) {
        try { await fetch(url); } catch (e2) {}
        if (await warteVerifizieren(3)) {
          zeigeMeldung('Eintrag wurde gespeichert');
        } else {
          throw new Error('Der Eintrag konnte nicht gespeichert werden. Bitte prüfen Sie die Internetverbindung und versuchen Sie es erneut.');
        }
      } else {
        // Eintrag inkl. Anhang zu groß für GET: POST noch einmal versuchen und länger warten
        try { await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(daten) }); } catch (e3) {}
        if (await warteVerifizieren(5)) {
          zeigeMeldung('Eintrag wurde gespeichert');
        } else {
          throw new Error('Die Übertragung hat gerade nicht geklappt. Bitte laden Sie die Seite neu (Strg+F5) und versuchen Sie es erneut – der Eintrag ist dann noch im Formular.');
        }
      }
    }
    letzteEintraege.unshift(daten);
    if (letzteEintraege.length > 5) letzteEintraege.pop();
    zeigeLetzteEintraege();
    formularZuruecksetzen();
  } catch(err){
    if (err.name === 'AbortError'){
      zeigeMeldung('Das Speichern dauert zu lange. Bitte Internet prüfen – vor dem erneuten Versuch prüfen, ob der Eintrag nicht doch schon angekommen ist.', {fehler:true, dauerhaft:true});
    } else {
      zeigeMeldung('Fehler beim Speichern: ' + err.message, {fehler:true, dauerhaft:true});
    }
  } finally {
    speichereLaeuft = false;
    btnSpeichern.disabled = false;
    btnSpeichern.textContent = 'Eintrag Speichern';
  }
});

    const url = SCRIPT_URL + '?modus=' + encodeURIComponent(modus) + '&wert=' + encodeURIComponent(wert); // Filterung 'ab' clientseitig
    const ctrl = new AbortController();                    // Timeout, damit die Meldung nicht endlos haengt

    try { res = await fetch(url, {signal: ctrl.signal}); }
    finally { clearTimeout(timer); }
    const antwortText = await res.text();
    let json;
    try {
      json = JSON.parse(antwortText);
    } catch (parseErr){
      // Das Script hat eine HTML-Seite statt JSON gesendet (meist: URL passt nicht zur Bereitstellung)
      throw new Error('Das Script hat keine gültige Antwort gesendet. Bitte prüfen: (1) Stimmt die Web-App-URL in der HTML (SCRIPT_URL) mit der aktuellen Bereitstellung überein? (2) Ist der Zugriff auf "Jeder mit Google-Konto" gesetzt?');
    }
    if (json.fehler) throw new Error(json.fehler);
    zeigeErgebnisse(json, modus);
    document.getElementById('meldung').className = '';
  } catch(err){
    if (err.name === 'AbortError'){
      zeigeMeldung('Die Abfrage dauert zu lange. Bitte Internetverbindung prüfen und erneut suchen.', {fehler:true, dauerhaft:true});

      zeigeMeldung('Fehler bei der Abfrage: ' + err.message, {fehler:true, dauerhaft:true});
    }
  } finally {
    btnSuchen.disabled = false;
    btnSuchen.textContent = 'Suchen';

function zeigeErgebnisse(json, modus){
  const box = document.getElementById('ergebnisListe');
  box.innerHTML = '';
  document.getElementById('schuelerIdFeld').classList.remove('sichtbar');
  const liste = json.treffer || json;
  let treffer = Array.isArray(liste) ? liste : [];
  const ab = document.getElementById('eintragAbInp') ? document.getElementById('eintragAbInp').value : '';
  if (ab) treffer = treffer.filter(t => alsIsoDatum(t.datum) >= ab); // beide Datumsformate korrekt vergleichen
  treffer.sort((a,b)=> alsIsoDatum(b.datum).localeCompare(alsIsoDatum(a.datum))); // absteigend: neueste Einträge oben

  letzteTreffer = treffer;
  document.getElementById('berichtBtnZeile').classList.toggle('versteckt', treffer.length === 0);
  if (treffer.length === 0){
    const idBlock = modus === 'schueler' && json.schuelerId && Object.keys(json.schuelerId).length;
    box.innerHTML = '<div class="hinweis">' +
      (idBlock ? "Keine weiteren Einträge -- Angaben siehe Feld 'Schüler-ID'"
               : 'Keine Einträge gefunden.') + '</div>';
  } else {
    const karteEintrag = (t)=>{
      const farbe = (ARTE.find(a=>a.wert===t.art)||{}).farbe || '';
      const karte = el('div', {class:'eintrag '+(FARBE_KLASSE[farbe]||'')}, box);
      const d = isoZuDeutsch(t.datum);
      karte.innerHTML =
        '<div class="zeile-art">' + (t.art||'') + '</div>' +
        '<div>' + d + '</div>' +
        '<div>' + (t.lehrerkuerzel||'') + ' (' + (t.schulfach||'') + ') (' + (t.klasse||'') + ')' +
          (modus==='art' && t.schueler ? ' – ' + t.schueler : '') + '</div>' +
        '<div>' + (t.nachricht||'').replace(/</g,'&lt;') + '</div>' +
        (t.anhaenge ? '<div><a href="' + t.anhaenge + '" target="_blank" rel="noopener">Dateianhang</a></div>' : '');
    };
    if (modus === 'schueler'){
      // Nach Kategorien geordnet, jeweils mit Anzahl in Klammern: Vorfallmelder, Inklusion, Elterngespraech
      const gruppen = {};
      treffer.forEach(t=>{ (gruppen[t.art] = gruppen[t.art] || []).push(t); });
      KATEGORIE_REIHENFOLGE.forEach(kat=>{
        if (!gruppen[kat] || !gruppen[kat].length) return;
        const farbe = (ARTE.find(a=>a.wert===kat)||{}).farbe || '';
        const h = el('div', {class:'kat-kopf ' + (FARBE_KLASSE[farbe] || '')}, box);
        const n = gruppen[kat].length;
        h.textContent = kat + ' (' + n + (n === 1 ? ' Eintrag' : ' Einträge') + ')';
        gruppen[kat].forEach(karteEintrag);
      });
    } else {
      treffer.forEach(karteEintrag);
    }
  }
  // Schueler-ID
  if (modus === 'schueler' && json.schuelerId){
    const id = json.schuelerId;
    const zeilen = [];
    function idZeile(symbol, label, obj){
      if (!obj || !obj.wert) return;
      const d = isoZuDeutsch(obj.datum);
      zeilen.push('<div><span class="idLabel">' + symbol + ' ' + label + ':</span> ' + obj.wert +
        (d ? ' <span class="idInfo">(' + d + ')</span>' : '') +
        (obj.info ? ' <span class="idInfo">' + obj.info.replace(/</g,'&lt;') + '</span>' : '') + '</div>');
    }
    idZeile('📚','BUT', id.but);
    idZeile('🧩','Förderbedarf', id.foerderbedarf);
    idZeile('✍️📖','LRS', id.lrs);
    idZeile('🕒','Nachteilsausgleich', id.nachteilsausgleich);
    if (id.merkmale && id.merkmale.length){
      id.merkmale.forEach(mk=>{
        const d = isoZuDeutsch(mk.datum);
        zeilen.push('<div><span class="idLabel">◉ Merkmal:</span> ' +
          (d ? '<span class="idInfo">(' + d + ')</span> ' : '') +
          '<span class="idInfo">' + (mk.info||'').replace(/</g,'&lt;') + '</span></div>');
      });
    }
    if (zeilen.length){
      document.getElementById('schuelerIdInhalt').innerHTML = zeilen.join('');
      document.getElementById('schuelerIdFeld').classList.add('sichtbar');
    }
  }
}

/* ================= Bericht drucken (PDF) ================= */
const KATEGORIE_REIHENFOLGE = ['Vorfallmelder', 'Inklusion', 'Elterngespräch'];

/* Stile des Berichts fuer den eigenstaendigen Tab (iOS) */
const REPORT_CSS = `
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Yu Gothic', 'YuGothic', 'Segoe UI', sans-serif; font-size: 10.5pt; color: #111; background: #fff; max-width: 180mm; margin: 0 auto; padding: 8mm 4mm; }
  #druckKopfZeile { display: flex; justify-content: space-between; align-items: flex-start; }
  #druckLinks { flex: 1; padding-right: 6mm; }
  #druckLogo { width: 50mm; height: 50mm; flex: none; }
  #druckLogo svg { width: 100%; height: 100%; }
  #druckCopyright { font-size: 8pt; color: #9aa4b0; }
  #druckKopf { margin-top: 2mm; }
  #druckKopf h1 { font-size: 20pt; margin-bottom: 2mm; color: #2f4a68; }
  #druckMeta { font-size: 10pt; color: #444; line-height: 1.55; }
  #druckSchueler { margin: 5mm 0 6mm 0; }
  #druckSchueler h2 { font-size: 13pt; margin-bottom: 2mm; }
  #druckSchueler ul { margin-left: 6mm; }
  .druck-kat { font-size: 13pt; font-weight: bold; margin: 5mm 0 3mm 0; padding-bottom: 1mm; border-bottom: 0.5mm solid #c8d4e0; page-break-after: avoid; }
  .druck-kat.k-gruen { color: #15803d; } .druck-kat.k-rot { color: #dc2626; }
  .druck-kat.k-gelb { color: #a16207; } .druck-kat.k-blau { color: #2563eb; }
  .druck-eintrag { border: 1px solid #c0c8d2; border-left: 1.5mm solid #999; border-radius: 2mm; padding: 3mm 4mm; margin-bottom: 4mm; page-break-inside: avoid; line-height: 1.45; }
  .druck-eintrag .d-art { font-weight: bold; }
  .druck-eintrag.k-gruen { border-left-color: #16a34a; } .druck-eintrag.k-gruen .d-art { color: #15803d; }
  .druck-eintrag.k-rot { border-left-color: #dc2626; } .druck-eintrag.k-rot .d-art { color: #dc2626; }
  .druck-eintrag.k-gelb { border-left-color: #eab308; } .druck-eintrag.k-gelb .d-art { color: #a16207; }
  .druck-eintrag.k-blau { border-left-color: #2563eb; } .druck-eintrag.k-blau .d-art { color: #2563eb; }
  #iosHinweis { background: #eff6ff; color: #1e3a5f; border: 1px solid #93c5fd; border-radius: 3mm; padding: 3mm 4mm; font-size: 9.5pt; margin-bottom: 5mm; }
  @page { size: A4; margin: 15mm; }
`;

document.getElementById('btnBericht').addEventListener('click', ()=>{
  const modus = suchenNachSel.value;
  const suchWert = ddSuchWert ? ddSuchWert.wert()[0] : '';
  if (!modus || !suchWert || !letzteTreffer.length){
    zeigeMeldung('Keine Einträge für den Bericht vorhanden. Bitte zuerst suchen.', {fehler:true});
    return;
  }
  const ab = document.getElementById('eintragAbInp') ? document.getElementById('eintragAbInp').value : '';
  const heute = new Date();
  const heuteIso = heute.getFullYear() + '-' + String(heute.getMonth()+1).padStart(2,'0') + '-' + String(heute.getDate()).padStart(2,'0');
  const aktuelleKlasse = berechneKlasse(heuteIso); // "jetzige Klasse" am Tag des Ausdrucks

  const druck = document.getElementById('druckBereich');
  druck.innerHTML = '';

  // Kopfzeile (nur erste Seite): links Copyright + Berichtsblock, rechts Logo – beide auf gleicher Hoehe
  const kopfZeile = el('div', {id:'druckKopfZeile'}, druck);
  const linksBox = el('div', {id:'druckLinks'}, kopfZeile);
  const copy = el('div', {id:'druckCopyright'}, linksBox);
  copy.textContent = '\u00A9 LogBuch_V26/27 Dipl.-Ing Rachid Harbi';
  const logoBox = el('div', {id:'druckLogo', 'aria-hidden':'true'}, kopfZeile);
  logoBox.appendChild(document.querySelector('#druckLogoVorlage svg').cloneNode(true));


  // Kopf: Suchparameter + Ausdruckdatum + "Einträge ab" nur wenn ein Datum gewählt ist
  let meta = '<strong>Suchkriterium:</strong> ' + (modus==='schueler' ? 'Schüler' : 'Art des Eintrags') +
             ' = ' + suchWert.replace(/</g,'&lt;') + '<br>' +
             '<strong>Ausgedruckt am:</strong> ' + isoZuDeutsch(heuteIso) + '<br>';
  if (ab) meta += '<strong>Einträge ab:</strong> ' + isoZuDeutsch(ab) + '<br>';
  meta += '<strong>Anzahl der Einträge:</strong> ' + letzteTreffer.length;
  const kopf = el('div', {id:'druckKopf'}, linksBox);
  kopf.innerHTML = '<h1>LogBuch-Bericht</h1><div id="druckMeta">' + meta + '</div>';

  // Schüler (nur bei Schülersuche) / jetzige Klasse
  const schBox = el('div', {id:'druckSchueler'}, linksBox);
  if (modus === 'schueler'){
    schBox.innerHTML = '<h2>Schüler: ' + suchWert.replace(/</g,'&lt;') +
                       ' &ndash; jetzige Klasse: ' + aktuelleKlasse + '</h2>';
  } else {
    schBox.innerHTML = '<h2>Jetzige Klasse: ' + aktuelleKlasse + '</h2>';
  }

  // Einträge ohne Schüler-ID, geordnet untereinander
  const eintragKarte = (t)=>{
    const farbe = (ARTE.find(a=>a.wert===t.art)||{}).farbe || '';
    const karte = el('div', {class:'druck-eintrag ' + (FARBE_KLASSE[farbe] || '')}, druck);
    const d = (t.datum && t.datum.indexOf('-') > -1) ? isoZuDeutsch(t.datum) : (t.datum || '');
    karte.innerHTML =
      '<div class="d-art">' + (t.art || '') + '</div>' +
      '<div>' + d + '</div>' +
      '<div>' + (t.lehrerkuerzel || '') + ' (' + (t.schulfach || '') + ') (' + (t.klasse || '') + ')' +
        (modus === 'art' && t.schueler ? ' &ndash; ' + t.schueler.replace(/</g,'&lt;') : '') + '</div>' +
      '<div>' + (t.nachricht || '').replace(/</g,'&lt;') + '</div>';
  };

  if (modus === 'schueler'){
    // Nach Kategorien geordnet: Vorfallmelder, Inklusion, Elterngespräch (innerhalb: Datum absteigend)
    const liste = letzteTreffer.slice();
    liste.sort((a,b)=> KATEGORIE_REIHENFOLGE.indexOf(a.art) - KATEGORIE_REIHENFOLGE.indexOf(b.art));
    const anzahl = {};
    liste.forEach(t=>{ anzahl[t.art] = (anzahl[t.art] || 0) + 1; });
    let aktuelleKat = null;
    liste.forEach(t=>{
      if (t.art !== aktuelleKat){
        aktuelleKat = t.art;
        const farbe = (ARTE.find(a=>a.wert===t.art)||{}).farbe || '';
        const h = el('h2', {class:'druck-kat ' + (FARBE_KLASSE[farbe] || '')}, druck);
        const n = anzahl[t.art];
        h.textContent = t.art + ' (' + n + (n === 1 ? ' Eintrag' : ' Einträge') + ')';
      }
      eintragKarte(t);
    });
  } else {
    // Art-Suche: chronologisch absteigend untereinander auflisten
    letzteTreffer.forEach(eintragKarte);
  }

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS){
    // iOS unterstuetzt window.print() nicht: Bericht als eigenstaendige Datei im neuen Tab oeffnen
    const hinweis = '<div id="iosHinweis"><strong>PDF speichern (iPhone/iPad):</strong> Teilen-Symbol ' +
      '(&#8593;) &rarr; Optionen / &bdquo;Als PDF sichern&ldquo; (alternativ: Drucken &rarr; Vorschau mit ' +
      'zwei Fingern aufziehen).</div>';
    const htmlDokument = '<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
      '<title>LogBuch-Bericht</title><style>' + REPORT_CSS + '</style></head><body>' +
      hinweis + druck.innerHTML + '</body></html>';
    const blobUrl = URL.createObjectURL(new Blob([htmlDokument], {type: 'text/html'}));
    window.open(blobUrl, '_blank');
    setTimeout(()=>URL.revokeObjectURL(blobUrl), 120000);
    zeigeMeldung('Bericht im neuen Tab geöffnet → Teilen-Symbol für PDF.');
  } else {
    setTimeout(()=>window.print(), 150); // Druckdialog oeffnet, Ausgabe als PDF moeglich
  }
});
</script>
</body>
</html>
